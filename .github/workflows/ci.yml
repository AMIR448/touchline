name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (no cloud calls, the AI crew runs on fake agents)
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web app parses
        run: node --check server/static/app/app.js
