[project]
name = "touchline"
version = "0.1.0"
description = "Explainable, personalized match intelligence from synthetic football events"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "agent-framework-core>=1.21,<2",
    "agent-framework-foundry>=1.14,<2",
    "azure-identity>=1.26",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "azure-eventhub>=5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
touchline = "touchline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simulator", "analytics", "broadcast", "ingest", "touchline", "server"]
